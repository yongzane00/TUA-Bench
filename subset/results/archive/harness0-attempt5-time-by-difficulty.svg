<text x="628" y="361" fill="#52514e" font-size="11.5">medium: 87 unsolved, median 20.1 min</text>
<text x="628" y="379" fill="#52514e" font-size="11.5">hard: 21 unsolved, median 40.0 min</text>
<text x="628" y="405" fill="#898781" font-size="11">64 timed-out attempts are counted at</text>
<text x="628" y="420" fill="#898781" font-size="11">exactly 2400 s. The ~87 s the agent takes</text>
<text x="628" y="435" fill="#898781" font-size="11">to stop after the limit is excluded.</text>
<text x="628" y="457" fill="#898781" font-size="11">3 attempts hit the limit and were still</text>
<text x="628" y="472" fill="#898781" font-size="11">graded as solved.</text>
