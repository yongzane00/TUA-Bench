<text x="628" y="140" fill="#0b0b0b" font-size="13.5" font-weight="600">What it shows</text>
<text x="628" y="168" fill="#0b0b0b" font-size="12.5">Solves take 8–11 min at every</text>
<text x="628" y="187" fill="#0b0b0b" font-size="12.5">difficulty.</text>
<text x="628" y="206" fill="#52514e" font-size="11.5">Difficulty changes how often the</text>
<text x="628" y="225" fill="#52514e" font-size="11.5">agent solves, not how long it takes.</text>
<text x="628" y="254" fill="#0b0b0b" font-size="12.5">Unsolved attempts are the slow ones.</text>
<text x="628" y="273" fill="#52514e" font-size="11.5">Most run until the agent limit</text>
<text x="628" y="292" fill="#52514e" font-size="11.5">kills them.</text>
<line x1="628" y1="321" x2="884" y2="321" stroke="#e1e0d9"/>
