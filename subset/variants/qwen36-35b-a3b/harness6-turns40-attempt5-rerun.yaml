# qwen36-35b-a3b/harness6-turns40-attempt5-rerun: re-run of the 4 trials of harness6-turns40-attempt5/2026-10-07__17-17-03
# whose docker compose build failed (012, 016, 021, 119). Identical to harness6-turns40-attempt5.yaml except
# n_attempts = 1 and the task list. Merged into the original run afterwards.
#
#   harbor run -c subset/variants/qwen36-35b-a3b/harness6-turns40-attempt5-rerun.yaml -o jobs/qwen36-35b-a3b/harness6-turns40-attempt5-rerun
n_attempts: 1
n_concurrent_trials: 4
datasets:
- path: tasks
  task_names:
  - 012-hide-na-budget-values
  - 016-count-invoice-pivot
  - 021-fill-ramp-chart
  - 119-tabstop-sentence-split
agents:
- name: null
  model_name: openai/nvidia/Qwen3.6-35B-A3B-NVFP4
  kwargs:
    api_base: http://<qwen36-vllm-host>:8000/v1
    temperature: 0.7
    reasoning_effort: xhigh
    max_turns: 40
    model_info:
      max_input_tokens: 262144
      max_output_tokens: 32768
      input_cost_per_token: 5.0e-08
      output_cost_per_token: 7.0e-07
    llm_call_kwargs:
      max_tokens: 32768
  import_path: harbor.agents.terminus_2.terminus_2_harness6:Terminus2Harness6
