# qwen38-flash-next/cc-heldout-hidden-noweb-time900-rounds3 - PROPOSED batch 5 (not run; needs the user's go-ahead):
# the cc-dev-hidden-noweb config on the 40 held-out pilot tasks. Origin: batch 4 config plus disallowed_tools (2026-11-20): WebFetch and
# WebSearch off. In batch 4 they fetched Django's upstream fixes and a WebFetch sub-request got its own proxy clock
# (trials up to 812 s late). Run with TAG=-noweb bash subset/tools/run_cc_batch.sh. Batch 4 header:
# written by hand (not from make_variant.py): batch 4 of
# subset/results/analysis-plan.md. Harbor's claude-code agent, unchanged and pinned to one version, on qwen3.8 through
# the time-budget proxy for the hidden arm (port 8911; started by subset/tools/run_cc_batch.sh with
# --feedback hidden --budget 900 --report-request --track-conversations --cap-tool-timeout Bash:timeout:ms:120000
# --cap-margin 3.5). The container reaches the proxy as host.docker.internal; no Anthropic API is called.
# CLAUDE_CODE_DISABLE_BACKGROUND_TASKS=1: a Bash command whose timeout the proxy lowered to the time left is
# ended at that timeout instead of moved to the background (Harbor turns background tasks on; checked with
# pilot/selftest/selftest-cc-timeout*.yaml). The model aliases are the ones Harbor sets itself when the proxy
# address comes from the shell environment instead of env below.
#
#   bash subset/tools/run_cc_batch.sh      (proxies + quiet-start rounds for both arms)
