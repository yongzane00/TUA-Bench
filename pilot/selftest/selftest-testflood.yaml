# Scripted-model self-test of the stop during a flood of test output (script testflood) (pilot/selftest/scripted_agent.py); no model server is used.
#
#   cd ~/work/TUA-Bench
#   PYTHONPATH=pilot/selftest uv run --no-sync harbor run -c pilot/selftest/selftest-testflood.yaml \
#       -o <TUA-Bench on C:>/jobs/pilot/selftest-testflood --yes
n_attempts: 3
n_concurrent_trials: 1
datasets:
- path: ../datasets/swe-bench-verified
  task_names:
  - django__django-11149
agents:
- import_path: scripted_agent:ScriptedH7
  model_name: openai/scripted-selftest
  kwargs:
    api_base: http://127.0.0.1:9/v1
    time_budget_sec: 40
    hard_deadline: true
    clock: wall
    save_diff_of: /testbed
    interrupt_at_stop: true
    script: testflood
