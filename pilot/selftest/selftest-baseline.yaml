# Plugin-off check (plan p7, p11): one scripted conversation, three agents at once on the same task: stock
# terminus-2, H7 with feedback hidden (the plugin's off position) and H7 full. No model server is used.
# Compare what each model was sent with pilot/selftest/compare_prompts.py <job folder>.
#
#   cd ~/work/TUA-Bench
#   PYTHONPATH=pilot/selftest uv run --no-sync harbor run -c pilot/selftest/selftest-baseline.yaml \
#       -o <TUA-Bench on C:>/jobs/pilot/selftest-baseline --yes
n_attempts: 1
n_concurrent_trials: 3
datasets:
- path: ../datasets/swe-bench-verified
  task_names:
  - django__django-11099
agents:
- import_path: scripted_agent:ScriptedStock
  model_name: openai/scripted-selftest
  kwargs:
    api_base: http://127.0.0.1:9/v1
    script: baseline
- import_path: scripted_agent:ScriptedH7
  model_name: openai/scripted-selftest
  kwargs:
    api_base: http://127.0.0.1:9/v1
    time_budget_sec: 600
    feedback: hidden
    script: baseline
- import_path: scripted_agent:ScriptedH7
  model_name: openai/scripted-selftest
  kwargs:
    api_base: http://127.0.0.1:9/v1
    time_budget_sec: 600
    script: baseline
