# Week-1 reproducibility check (plan p2 and p11): Harbor's oracle agent applies each task's reference patch and
# runs its tests, with no model call. A task counts as reproducible when both attempts give reward 1.
# The 10 tasks are the first 10 dev tasks in pilot/tasks.md. Dataset: harbor datasets download
# swe-bench/swe-bench-verified -o ~/work/datasets (task folders are read from ../datasets, next to the repo).
#
#   cd ~/work/TUA-Bench
#   uv run --no-sync harbor run -c pilot/configs/oracle-week1.yaml -o <TUA-Bench on C:>/jobs/pilot/oracle-week1 --yes
n_attempts: 2
n_concurrent_trials: 2
datasets:
- path: ../datasets/swe-bench-verified
  task_names:
  - django__django-7530
  - django__django-9296
  - django__django-10097
  - django__django-10880
  - django__django-10914
  - django__django-10973
  - django__django-10999
  - django__django-11066
  - django__django-11087
  - django__django-11095
agents:
- name: oracle
